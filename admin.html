<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>콘텐츠 관리자 | THEOBROMA</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div><p>THEOBROMA CONTENT MANAGER</p><h1>콘텐츠 관리자</h1></div>
    <a href="index.html" target="_blank">사이트 미리보기 ↗</a>
  </header>
  <main>
    <aside>
      <button class="folder-button" id="choose-folder" type="button">프로젝트 폴더 선택</button>
      <p class="folder-status" id="folder-status">저장하려면 먼저 <b>New project</b> 폴더를 선택하세요.</p>
      <nav id="page-nav" aria-label="관리 페이지"></nav>
    </aside>
    <section class="editor">
      <div class="editor-heading"><div><p id="page-kicker"></p><h2 id="page-title"></h2></div><button id="save" type="button">변경 내용 저장</button></div>
      <p class="notice">입력하지 않은 칸은 기존 페이지 내용이 그대로 유지됩니다. 줄바꿈도 실제 화면에 반영됩니다.</p>
      <form id="content-form"></form>
      <div class="save-message" id="save-message" role="status"></div>
    </section>
  </main>
  <script src="site-content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
